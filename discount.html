
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حاسبة الخصم | احسبها</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="container nav-container">

        <div class="logo">
            🧮 احسبها
        </div>

        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="index.html#categories">التصنيفات</a>
            <a href="index.html#calculators">الحاسبات</a>
        </nav>

    </div>

</header>


<main class="calculator-page">

    <div class="container">

        <div class="calculator-heading">

            <h1>حاسبة الخصم</h1>

            <p>
                احسب قيمة الخصم والسعر النهائي بعد الخصم بسهولة.
            </p>

        </div>


        <div class="gpa-box discount-box">

            <h2>احسب السعر بعد الخصم</h2>

            <div class="input-group">

                <label for="originalPrice">
                    السعر الأصلي
                </label>

                <input
                    type="number"
                    id="originalPrice"
                    placeholder="مثال: 100"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="input-group">

                <label for="discountPercent">
                    نسبة الخصم(%)
                </label>

                <input
                    type="number"
                    id="discountPercent"
                    placeholder="مثال: 20"
                    min="0"
                    max="100"
                    step="0.01"
                >

            </div>


            <button
                class="calculate-button"
                onclick="calculateDiscount()"
            >
                احسب الخصم
            </button>


            <div
                id="discountResult"
                class="result"
                style="display:none;"
            ></div>

        </div>


        <div class="info-box">

            <h3>مثال</h3>

            <p>
                إذا كان السعر الأصلي <strong>100 دينار</strong>
                ونسبة الخصم <strong>20%</strong>:
            </p>

            <p>
                قيمة الخصم = <strong>20 دينار</strong>
            </p>

            <p>
                السعر بعد الخصم = <strong>80 دينار</strong>
            </p>

        </div>

    </div>

</main>


<footer>

    <div class="container">

        <p>
            © 2026 احسبها - جميع الحقوق محفوظة
        </p>

    </div>

</footer>


<script src="script.js"></script>

</body>

</html>
