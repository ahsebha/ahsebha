
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حاسبة العمر | احسبها</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="container nav-container">

        <div class="logo">
            🧮 احسبها
        </div>

        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="index.html#categories">التصنيفات</a>
            <a href="index.html#calculators">الحاسبات</a>
        </nav>

    </div>

</header>


<main class="calculator-page">

    <div class="container">

        <div class="calculator-heading">

            <h1>حاسبة العمر</h1>

            <p>
                أدخل تاريخ ميلادك لمعرفة عمرك بالتفصيل.
            </p>

        </div>


        <div class="gpa-box age-box">

            <h2>تاريخ الميلاد</h2>

            <div class="input-group">

                <label for="birthDate">
                    تاريخ ميلادك
                </label>

                <input
                    type="date"
                    id="birthDate"
                >

            </div>


            <button
                class="calculate-button"
                onclick="calculateAge()"
            >
                احسب عمري 🎂
            </button>


            <div
                id="ageResult"
                class="result"
                style="display:none;"
            ></div>

        </div>


        <div class="info-box">

            <h3>ماذا تحسب الحاسبة؟</h3>

            <p>
                تحسب الحاسبة عمرك الحالي بالسنوات والأشهر والأيام،
                بالإضافة إلى موعد عيد ميلادك القادم.
            </p>

        </div>

    </div>

</main>


<footer>

    <div class="container">

        <p>
            © 2026 احسبها - جميع الحقوق محفوظة
        </p>

    </div>

</footer>


<script src="script.js"></script>

</body>

</html>
