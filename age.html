<div class="container">

        <h1>
            حاسبة العمر
        </h1>

        <p>
            أدخل تاريخ ميلادك لمعرفة عمرك بالتفصيل باستخدام

    <div class="gpa-box age-box">

        <h2>
            تاريخ الميلاد
        </h2>

        <div class="input-group">

            <label for="birthDate">
                تاريخ ميلادك
            </label>

            <input
                type="date"
                id="birthDate"
            >

        </div>


        <button
            class="calculate-button"
            onclick="calculateAge()"
        >
            احسب عمري 🎂
        </button>


        <div
            id="ageResult"
            class="result"
            style="display:none;"
        ></div>

    </div>


    <div class="info-box">

        <h2>
            ماذا تحسب الحاسبة؟

            تحسب الحاسبة عمرك الحالي
